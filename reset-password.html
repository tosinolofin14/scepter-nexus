<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Scepter Nexus</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <style>
        body { background: var(--color-off-white); display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Inter', sans-serif; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: white; padding: 48px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 400px; text-align: center; }
        h1 { font-family: 'Outfit'; color: var(--color-navy); margin-bottom: 8px; font-size: 28px; }
        p { color: #6B7280; font-size: 14px; margin-bottom: 24px; }
        input { width: 100%; height: 44px; border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 16px; padding: 0 14px; box-sizing: border-box; font-family: 'Inter'; }
        button { width: 100%; height: 48px; background: var(--color-navy); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 15px; }
        button:hover { background: var(--color-emerald); }
        .error { color: #DC2626; font-size: 13px; display: none; margin-bottom: 16px; text-align: left; }
    </style>
</head>
<body>
    <div class="card" id="formCard">
        <h1>Reset Password</h1>
        <p>Enter a new password for your account.</p>
        <form id="resetForm">
            <div id="error" class="error"></div>
            <input type="password" id="pass" placeholder="New password" required>
            <input type="password" id="confirmPass" placeholder="Confirm new password" required>
            <button type="submit">Update Password</button>
        </form>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const email = params.get('email');
        if (!token || !email) {
            document.getElementById('formCard').innerHTML = '<h1>Invalid Link</h1><p>Reset link is malformed, missing, or expired.</p>';
        }

        document.getElementById('resetForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const p1 = document.getElementById('pass').value;
            const p2 = document.getElementById('confirmPass').value;
            if (p1 !== p2) {
                document.getElementById('error').textContent = 'Passwords do not match';
                document.getElementById('error').style.display = 'block';
                return;
            }
            if (p1.length < 8) {
                document.getElementById('error').textContent = 'Password must be at least 8 characters';
                document.getElementById('error').style.display = 'block';
                return;
            }
            // MOCK placeholder
            alert('Password reset successfully sent to backend. Returning to login!');
            window.location.href = '/portal.html';
        });
    </script>
</body>
</html>
