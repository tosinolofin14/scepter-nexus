<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Scepter Nexus</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // ROUTE PROTECTION
        let sn_token = localStorage.getItem('sn_token');
        if (!sn_token) window.location.href = '/portal.html';
        
        async function fetchUser() {
            try {
                const res = await fetch('/api/auth/me', { headers: { 'Authorization': `Bearer ${sn_token}` } });
                if (!res.ok) {
                    localStorage.removeItem('sn_token');
                    window.location.href = '/portal.html';
                    return;
                }
                const user = await res.json();
                document.getElementById('userName').textContent = user.first_name;
            } catch (err) { console.error("Auth error", err); }
        }
    </script>
    <style>
        :root {
            --color-emerald: #1A7A5E;
            --color-navy: #0D0D1A;
            --color-off-white: #F8F9FA;
            --color-gray-100: #F3F4F6;
            --color-gray-600: #4B5563;
        }
        body { background: var(--color-off-white); margin: 0; font-family: 'Inter', sans-serif; color: #111; }
        .navbar { background: var(--color-navy); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; color: white;}
        .brand-logo { font-family: 'Outfit'; font-size: 20px; font-weight: 700; text-decoration: none; display: flex; gap: 4px; }
        .brand-scepter { color: white; }
        .brand-nexus { color: var(--color-emerald) }
        .btn-outline-light { border: 1px solid white; color: white; background: transparent; padding: 8px 16px; border-radius: 6px; cursor: pointer; transition: 0.2s; font-family: 'Inter'; font-weight: 500;}
        .btn-outline-light:hover { background: white; color: var(--color-navy); }
        
        .dashboard-container { padding: 40px 24px; max-width: 1200px; margin: 0 auto; }
        .heading-lg { font-family: 'Outfit'; font-size: 32px; color: var(--color-navy); margin: 0 0 8px 0;}
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; margin-top: 32px; align-items: start;}
        
        .dash-card { background: white; border: 1px solid #E5E7EB; border-radius: 12px; padding: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); display: flex; flex-direction: column;}
        .dash-card h3 { color: var(--color-navy); margin: 0 0 16px 0; font-family: 'Outfit'; font-size: 20px;}
        
        /* Documents UI */
        .doc-list { list-style: none; padding: 0; margin: 0 0 16px 0; max-height: 200px; overflow-y: auto;}
        .doc-item { padding: 12px; background: var(--color-gray-100); border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; font-size: 14px;}
        .btn-upload { background: var(--color-emerald); color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; display: block; text-align: center; text-decoration: none; font-size: 14px; font-weight: 500;}
        
        /* Messages UI */
        .msg-list { list-style: none; padding: 0; margin: 0 0 16px 0; height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;}
        .msg-bubble { background: var(--color-gray-100); padding: 10px 14px; border-radius: 8px; font-size: 14px; max-width: 85%; }
        .msg-bubble.user { background: var(--color-emerald); color: white; align-self: flex-end; }
        .msg-bubble.admin { background: #E5E7EB; color: #111; align-self: flex-start; }
        .msg-input-row { display: flex; gap: 8px; }
        .msg-input { flex: 1; border: 1px solid #D1D5DB; padding: 8px 12px; border-radius: 6px; font-family: 'Inter'; font-size: 14px; outline: none; }
        .msg-btn { background: var(--color-navy); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 500;}

    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="brand-logo"><span class="brand-scepter">Scepter</span><span class="brand-nexus">Nexus</span></a>
        <button onclick="handleLogout()" class="btn-outline-light">Log Out</button>
    </nav>

    <main class="dashboard-container">
        <h1 class="heading-lg">Welcome back, <span id="userName">User</span>!</h1>
        <p style="color: var(--color-gray-600); margin:0;">Here is your strategic intelligence overview.</p>
        
        <div class="dashboard-grid">
            <!-- WIDGET 1: KPI Chart -->
            <div class="dash-card">
                <h3>Financial Metrics (6mo)</h3>
                <canvas id="kpiChart" width="400" height="250"></canvas>
            </div>

            <!-- WIDGET 2: Documents -->
            <div class="dash-card">
                <h3>Documents</h3>
                <ul class="doc-list" id="docList"></ul>
                
                <input type="file" id="fileUpload" style="display:none;" />
                <button class="btn-upload" onclick="document.getElementById('fileUpload').click()">+ Upload Document</button>
            </div>

            <!-- WIDGET 3: Messages -->
            <div class="dash-card">
                <h3>Advisory Team Chat</h3>
                <div class="msg-list" id="msgList"></div>
                <div class="msg-input-row">
                    <input type="text" id="msgInput" class="msg-input" placeholder="Type a message..." onkeypress="if(event.key === 'Enter') sendMessage()" />
                    <button class="msg-btn" onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script>
        fetchUser();

        function handleLogout() {
            localStorage.removeItem('sn_token');
            fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = '/portal.html';
        }

        // ======================================
        // WIDGET 1: Financial Chart
        // ======================================
        async function loadChart() {
            const res = await fetch('/api/dashboard/kpi', { headers: { 'Authorization': `Bearer ${sn_token}` } });
            if (!res.ok) return;
            const data = await res.json();
            
            const ctx = document.getElementById('kpiChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.labels,
                    datasets: [
                        { label: 'Gross Revenue', data: data.revenue, borderColor: '#1A7A5E', backgroundColor: '#1A7A5E', tension: 0.4 },
                        { label: 'Operating Expenses', data: data.expenses, borderColor: '#DC2626', backgroundColor: '#DC2626', tension: 0.4 }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { position: 'bottom' } },
                    scales: { y: { beginAtZero: true } }
                }
            });
        }
        loadChart();

        // ======================================
        // WIDGET 2: Documents Upload
        // ======================================
        async function loadDocuments() {
            const res = await fetch('/api/documents', { headers: { 'Authorization': `Bearer ${sn_token}` } });
            if (!res.ok) return;
            const docs = await res.json();
            const list = document.getElementById('docList');
            if (docs.length === 0) {
                list.innerHTML = '<li class="doc-item" style="justify-content:center; color:#9ca3af;">No documents uploaded.</li>';
                return;
            }
            list.innerHTML = docs.map(d => `<li class="doc-item"><span>📄 ${d.name}</span><span style="color:#6B7280; font-size:12px;">${new Date(d.created_at).toLocaleDateString()}</span></li>`).join('');
        }
        loadDocuments();

        document.getElementById('fileUpload').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // Simple FileReader to grab base64 payload
            const reader = new FileReader();
            reader.onload = async (ev) => {
                const base64 = ev.target.result;
                const res = await fetch('/api/documents', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${sn_token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: file.name, base64 })
                });
                if (res.ok) {
                    if(window.showToast) window.showToast('Document uploaded!', false);
                    loadDocuments();
                }
            };
            reader.readAsDataURL(file);
        });

        // ======================================
        // WIDGET 3: Chat Messaging
        // ======================================
        async function loadMessages() {
            const res = await fetch('/api/messages', { headers: { 'Authorization': `Bearer ${sn_token}` } });
            if (!res.ok) return;
            const msgs = await res.json();
            const list = document.getElementById('msgList');
            list.innerHTML = msgs.map(m => `<div class="msg-bubble ${m.sender}">${m.content}</div>`).join('');
            list.scrollTop = list.scrollHeight;
        }
        loadMessages();

        async function sendMessage() {
            const input = document.getElementById('msgInput');
            const content = input.value.trim();
            if (!content) return;

            input.value = '';
            
            // Optimistic UI push
            const list = document.getElementById('msgList');
            list.innerHTML += `<div class="msg-bubble user">${content}</div>`;
            list.scrollTop = list.scrollHeight;

            const res = await fetch('/api/messages', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${sn_token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ content })
            });
            if (res.ok) loadMessages(); // Refresh exact state
        }
    </script>
</body>
</html>
